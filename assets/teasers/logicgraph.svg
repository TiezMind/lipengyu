<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Neuro-symbolic logic: a graph with two multi-hop reasoning paths and a verification badge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F5F9FD"/>
      <stop offset="1" stop-color="#E3ECF8"/>
    </linearGradient>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#C8D6EC"/>
    </pattern>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#dots)" opacity="0.55"/>
  <circle cx="18" cy="21" r="3.4" fill="#1F4E9B"/>
  <text x="27" y="24.8" font-family="'Inter',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#254a86" letter-spacing="0.2">Neuro-Symbolic Logic</text>

  <!-- non-selected (crossing) edges -->
  <g stroke="#B4C4DC" stroke-width="1.6">
    <line x1="52" y1="112" x2="120" y2="150"/>
    <line x1="120" y1="74" x2="192" y2="150"/>
    <line x1="120" y1="150" x2="192" y2="74"/>
  </g>
  <!-- path 1 (navy) -->
  <g stroke="#1F4E9B" stroke-width="3"><line x1="52" y1="112" x2="120" y2="74"/><line x1="120" y1="74" x2="192" y2="74"/><line x1="192" y1="74" x2="258" y2="112"/></g>
  <!-- path 2 (accent) -->
  <g stroke="#DE4C34" stroke-width="3"><line x1="52" y1="112" x2="120" y2="150"/><line x1="120" y1="150" x2="192" y2="150"/><line x1="192" y1="150" x2="258" y2="112"/></g>

  <!-- nodes -->
  <g font-family="'Inter',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="52" cy="112" r="14" fill="#1F4E9B"/><text x="52" y="116" fill="#fff">S</text>
    <circle cx="120" cy="74" r="13" fill="#EAF1FB" stroke="#1F4E9B" stroke-width="2.2"/><text x="120" y="78" fill="#1F4E9B">A</text>
    <circle cx="120" cy="150" r="13" fill="#EAF1FB" stroke="#1F4E9B" stroke-width="2.2"/><text x="120" y="154" fill="#1F4E9B">B</text>
    <circle cx="192" cy="74" r="13" fill="#EAF1FB" stroke="#1F4E9B" stroke-width="2.2"/><text x="192" y="78" fill="#1F4E9B">C</text>
    <circle cx="192" cy="150" r="13" fill="#EAF1FB" stroke="#1F4E9B" stroke-width="2.2"/><text x="192" y="154" fill="#1F4E9B">D</text>
    <circle cx="258" cy="112" r="14" fill="#1F4E9B"/><text x="258" y="116" fill="#fff">T</text>
  </g>

  <!-- verification badge -->
  <circle cx="292" cy="70" r="12" fill="#2E9E6B"/>
  <path d="M286 70 L290 74.5 L298 64.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
