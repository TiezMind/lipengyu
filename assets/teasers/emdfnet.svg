<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Traffic-sign detection: a warning sign inside a detection box with a multi-scale feature pyramid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F5F9FD"/>
      <stop offset="1" stop-color="#E3ECF8"/>
    </linearGradient>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#C8D6EC"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F4E9B"/>
    </marker>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#dots)" opacity="0.55"/>
  <circle cx="18" cy="21" r="3.4" fill="#1F4E9B"/>
  <text x="27" y="24.8" font-family="'Inter',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#254a86" letter-spacing="0.2">Traffic-Sign Detection</text>

  <!-- detection bounding box -->
  <rect x="50" y="58" width="116" height="106" rx="6" fill="none" stroke="#DE4C34" stroke-width="2.4" stroke-dasharray="7 5"/>
  <rect x="50" y="44" width="44" height="16" rx="4" fill="#DE4C34"/>
  <text x="72" y="56" text-anchor="middle" font-family="'Inter',-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" fill="#fff">0.98</text>

  <!-- warning sign -->
  <path d="M108 70 L142 148 L74 148 Z" fill="#FCEBCB" stroke="#DE4C34" stroke-width="2.8" stroke-linejoin="round"/>
  <rect x="105" y="96" width="6" height="28" rx="3" fill="#1B2733"/>
  <circle cx="108" cy="134" r="3.6" fill="#1B2733"/>

  <!-- link to feature pyramid -->
  <path d="M166 96 C 186 82 190 80 206 80" fill="none" stroke="#1F4E9B" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ah)"/>

  <!-- multi-scale feature pyramid -->
  <rect x="208" y="60" width="60" height="42" rx="5" fill="#EAF1FB" stroke="#1F4E9B" stroke-width="2"/>
  <g stroke="#BBD0EE" stroke-width="1.3"><line x1="228" y1="60" x2="228" y2="102"/><line x1="248" y1="60" x2="248" y2="102"/><line x1="208" y1="81" x2="268" y2="81"/></g>
  <rect x="216" y="112" width="44" height="32" rx="5" fill="#D3E0F4" stroke="#1F4E9B" stroke-width="2"/>
  <rect x="223" y="152" width="30" height="22" rx="5" fill="#C0D3F0" stroke="#1F4E9B" stroke-width="2"/>
  <g stroke="#1F4E9B" stroke-width="2" marker-end="url(#ah)"><line x1="238" y1="103" x2="238" y2="110"/><line x1="238" y1="145" x2="238" y2="150"/></g>
</svg>
